blueprint:
  name: "Kúrenie – model miestnosti v0.2"
  description: >-
    Model jednej vykurovacej miestnosti/zóny. Stav výsledného senzora je
    potreba tepla 0–100 %. Blueprint podporuje jeden alebo viac TRV,
    externý izbový teplotný snímač alebo fallback na current_temperature
    z climate entity, výkon radiátora a voliteľné učenie tepelnej straty W/K.

    Teploty prívodu a spiatočky sú voliteľné. Bez nich funguje regulačná
    časť (teplota, TRV, trend, potreba tepla), ale fyzikálny model a učenie
    W/K zostávajú bezpečne zablokované. Kotol priamo neovláda.
  domain: template
  homeassistant:
    min_version: "2026.8.0"

  input:
    room_label:
      name: Názov miestnosti
      description: Napr. Izba Emka
      default: Miestnosť
      selector:
        text:

    thermostat_entity:
      name: Termostat / TRV climate
      description: >-
        Z climate entity sa číta požadovaná teplota, HVAC režim a ako
        záložný zdroj aj current_temperature.
      selector:
        entity:
          filter:
            domain: climate

    room_temperature_entity:
      name: Externá izbová teplota
      description: >-
        Voliteľné. Ak je zadaná a dostupná, má prednosť. Ak zostane prázdna,
        použije sa current_temperature z climate entity.
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature

    valve_position_entities:
      name: Polohy ventilov TRV
      description: Vyber jeden alebo viac senzorov LEVEL/polohy ventilu pre túto miestnosť.
      selector:
        entity:
          filter:
            domain: sensor
          multiple: true

    valve_value_multiplier:
      name: Násobiteľ hodnoty TRV
      description: >-
        Ak senzor ukazuje 0–100 %, nechaj 1. Ak ukazuje 0.00–1.00,
        nastav 100.
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box

    outside_temperature_entity:
      name: Vonkajšia teplota
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature

    supply_temperature_entity:
      name: Teplota vykurovacej vody – prívod
      description: Voliteľné. Doplň neskôr z EMS-ESP/Bosch.
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature

    return_temperature_entity:
      name: Teplota vykurovacej vody – spiatočka
      description: Voliteľné. Doplň neskôr z EMS-ESP/Bosch.
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature

    window_entities:
      name: Okná / dvere miestnosti
      description: Voliteľné. Pri otvorenom kontakte sa učenie W/K zablokuje.
      default: []
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: true

    radiator_nominal_output_w:
      name: Menovitý výkon radiátora/ov
      description: >-
        Súčet výkonov radiátorov v miestnosti pri nižšie zadanom referenčnom
        spáde. Hodnota 0 vypne fyzikálny model a učenie W/K.
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 1
          unit_of_measurement: W
          mode: box

    radiator_reference_supply_c:
      name: Referenčný prívod radiátora
      default: 70
      selector:
        number:
          min: 30
          max: 90
          step: 1
          unit_of_measurement: "°C"
          mode: box

    radiator_reference_return_c:
      name: Referenčná spiatočka radiátora
      default: 55
      selector:
        number:
          min: 20
          max: 80
          step: 1
          unit_of_measurement: "°C"
          mode: box

    radiator_reference_room_c:
      name: Referenčná teplota miestnosti
      default: 20
      selector:
        number:
          min: 15
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

    radiator_exponent_n:
      name: Exponent radiátora n
      description: Korekčný exponent výkonu radiátora. Predvolene 1.30.
      default: 1.30
      selector:
        number:
          min: 1.0
          max: 1.6
          step: 0.01
          mode: box

    assumed_water_delta_t_c:
      name: Predpokladaný rozdiel prívod/spiatočka
      description: Používa sa pri spätnom výpočte požadovanej teploty prívodu.
      default: 10
      selector:
        number:
          min: 3
          max: 25
          step: 1
          unit_of_measurement: K
          mode: box

    room_weight:
      name: Váha miestnosti
      description: Centrálna regulácia ju neskôr použije ako prioritu. 1.0 = normálna.
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1
          mode: box

    initial_heat_loss_coefficient_w_per_k:
      name: Počiatočný koeficient tepelnej straty W/K
      description: Voliteľné. 0 = začať učenie bez predchádzajúceho odhadu.
      default: 0
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          unit_of_measurement: W/K
          mode: box

    valve_learning_threshold_pct:
      name: Minimálne otvorenie všetkých TRV pre učenie
      default: 85
      selector:
        number:
          min: 60
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

    stable_room_trend_c_per_h:
      name: Maximálny trend teploty pre učenie
      description: Izba sa musí približne tepelne ustáliť.
      default: 0.10
      selector:
        number:
          min: 0.02
          max: 0.50
          step: 0.01
          unit_of_measurement: "°C/h"
          mode: box

    min_inside_outside_delta_c:
      name: Minimálny rozdiel vnútri-vonku pre učenie
      description: Pri malom rozdiele je výpočet W/K príliš citlivý na chyby a vnútorné zisky.
      default: 10
      selector:
        number:
          min: 3
          max: 25
          step: 1
          unit_of_measurement: K
          mode: box

    max_water_change_c:
      name: Maximálna zmena teploty vody medzi vyhodnoteniami
      description: Pri prudkej zmene prívodu/spiatočky sa vzorka pre učenie zahodí.
      default: 2.0
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          unit_of_measurement: K
          mode: box

    target_stabilization_minutes:
      name: Pauza učenia po zmene požadovanej teploty
      description: Po zmene setpointu sa W/K určitý čas neučí.
      default: 30
      selector:
        number:
          min: 0
          max: 180
          step: 5
          unit_of_measurement: min
          mode: box

    learning_alpha:
      name: Rýchlosť učenia
      description: EMA koeficient. 0.05 = 5 % novej kvalitnej vzorky + 95 % starej hodnoty.
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 0.30
          step: 0.01
          mode: box

    night_learning_only:
      name: Učiť tepelnú stratu iba bez slnečných ziskov
      description: Pri zapnutí sa nové W/K vzorky prijímajú iba keď je Slnko pod horizontom.
      default: true
      selector:
        boolean:

variables:
  room_label: !input room_label
  thermostat_entity: !input thermostat_entity
  room_temperature_entity: !input room_temperature_entity
  valve_position_entities: !input valve_position_entities
  valve_value_multiplier: !input valve_value_multiplier
  outside_temperature_entity: !input outside_temperature_entity
  supply_temperature_entity: !input supply_temperature_entity
  return_temperature_entity: !input return_temperature_entity
  window_entities: !input window_entities
  radiator_nominal_output_w: !input radiator_nominal_output_w
  radiator_reference_supply_c: !input radiator_reference_supply_c
  radiator_reference_return_c: !input radiator_reference_return_c
  radiator_reference_room_c: !input radiator_reference_room_c
  radiator_exponent_n: !input radiator_exponent_n
  assumed_water_delta_t_c: !input assumed_water_delta_t_c
  room_weight: !input room_weight
  initial_heat_loss_coefficient_w_per_k: !input initial_heat_loss_coefficient_w_per_k
  valve_learning_threshold_pct: !input valve_learning_threshold_pct
  stable_room_trend_c_per_h: !input stable_room_trend_c_per_h
  min_inside_outside_delta_c: !input min_inside_outside_delta_c
  max_water_change_c: !input max_water_change_c
  target_stabilization_minutes: !input target_stabilization_minutes
  learning_alpha: !input learning_alpha
  night_learning_only: !input night_learning_only

triggers:
  - trigger: time_pattern
    minutes: "/5"
  - trigger: state
    entity_id: !input thermostat_entity
  - trigger: state
    entity_id: !input valve_position_entities
  - trigger: state
    entity_id: !input outside_temperature_entity

# Voliteľné entity (externá izbová teplota, prívod, spiatočka) zámerne nie sú
# state triggery. Ak sú použité, ich nové hodnoty sa načítajú najneskôr pri
# nasledujúcom 5-minútovom vyhodnotení. Tak môže byť ich input bezpečne prázdny.
actions:
  - variables:
      now_ts: "{{ as_timestamp(now()) | float(0) }}"
      hvac_mode: "{{ states(thermostat_entity) }}"
      hvac_action: "{{ state_attr(thermostat_entity, 'hvac_action') | default('unknown', true) }}"
      thermostat_current_temperature: >-
        {{ state_attr(thermostat_entity, 'current_temperature') | float(-999) }}
      external_room_temp_valid: >-
        {{ (room_temperature_entity | string | length) > 0 and has_value(room_temperature_entity) }}
      t_target: "{{ state_attr(thermostat_entity, 'temperature') | float(-999) }}"
      t_out: >-
        {{ states(outside_temperature_entity) | float(-999) if has_value(outside_temperature_entity) else -999 }}
      t_supply: >-
        {{ states(supply_temperature_entity) | float(-999)
           if (supply_temperature_entity | string | length) > 0 and has_value(supply_temperature_entity)
           else -999 }}
      t_return: >-
        {{ states(return_temperature_entity) | float(-999)
           if (return_temperature_entity | string | length) > 0 and has_value(return_temperature_entity)
           else -999 }}
      sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(90) }}"
      prev_h: >-
        {{ this.attributes.get('heat_loss_coefficient_w_per_k', initial_heat_loss_coefficient_w_per_k) | float(0) }}
      prev_learning_samples: >-
        {{ this.attributes.get('learning_samples', 0) | int(0) }}
      prev_supply: >-
        {{ this.attributes.get('supply_temp_c', -999) | float(-999) }}
      prev_return: >-
        {{ this.attributes.get('return_temp_c', -999) | float(-999) }}
      prev_trend_ref_ts: >-
        {{ this.attributes.get('trend_reference_timestamp', 0) | float(0) }}
      prev_trend_ref_temp: >-
        {{ this.attributes.get('trend_reference_temp_c', -999) | float(-999) }}
      prev_trend: >-
        {{ this.attributes.get('temperature_trend_c_per_h', 0) | float(0) }}
      prev_trend_ready: >-
        {{ this.attributes.get('trend_ready', false) | bool }}
      prev_target: >-
        {{ this.attributes.get('previous_target_temp_c', -999) | float(-999) }}
      prev_target_change_ts: >-
        {{ this.attributes.get('target_change_timestamp', 0) | float(0) }}

  - variables:
      t_room: >-
        {% if external_room_temp_valid | bool %}
          {{ states(room_temperature_entity) | float(-999) }}
        {% else %}
          {{ thermostat_current_temperature | float(-999) }}
        {% endif %}
      room_temperature_source: >-
        {{ room_temperature_entity if external_room_temp_valid | bool else thermostat_entity ~ ':current_temperature' }}
      heating_enabled: >-
        {{ (hvac_mode | string) not in ['off', 'unavailable', 'unknown'] }}

  # Sledovanie zmeny setpointu. Učenie sa po zmene dočasne pozastaví.
  - variables:
      target_changed: >-
        {{ (t_target | float) > -100
           and (prev_target | float) > -100
           and (((t_target | float) - (prev_target | float)) | abs) >= 0.1 }}
      target_change_timestamp: >-
        {% if (prev_target | float) <= -100 %}
          {{ now_ts }}
        {% elif target_changed | bool %}
          {{ now_ts }}
        {% else %}
          {{ prev_target_change_ts if (prev_target_change_ts | float) > 0 else now_ts }}
        {% endif %}
      target_stable_minutes: >-
        {% set ts = target_change_timestamp | float(0) %}
        {{ (((now_ts | float) - ts) / 60) | round(1) if ts > 0 else 0 }}
      target_stable: >-
        {{ (target_stable_minutes | float(0)) >= (target_stabilization_minutes | float(0)) }}

  # Stav TRV a okien.
  - variables:
      valid_valve_count: >-
        {% set ns = namespace(n=0) %}
        {% for e in valve_position_entities %}
          {% if has_value(e) %}{% set ns.n = ns.n + 1 %}{% endif %}
        {% endfor %}
        {{ ns.n }}
      valve_avg_pct: >-
        {% set ns = namespace(n=0, total=0.0) %}
        {% for e in valve_position_entities %}
          {% if has_value(e) %}
            {% set v = (states(e) | float(0)) * (valve_value_multiplier | float(1)) %}
            {% set ns.n = ns.n + 1 %}
            {% set ns.total = ns.total + ([0, [v, 100] | min] | max) %}
          {% endif %}
        {% endfor %}
        {{ (ns.total / ns.n) | round(1) if ns.n > 0 else 0 }}
      valve_max_pct: >-
        {% set ns = namespace(v=0.0) %}
        {% for e in valve_position_entities %}
          {% if has_value(e) %}
            {% set x = (states(e) | float(0)) * (valve_value_multiplier | float(1)) %}
            {% set x = [0, [x, 100] | min] | max %}
            {% if x > ns.v %}{% set ns.v = x %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.v | round(1) }}
      valve_min_pct: >-
        {% set ns = namespace(n=0, v=100.0) %}
        {% for e in valve_position_entities %}
          {% if has_value(e) %}
            {% set x = (states(e) | float(0)) * (valve_value_multiplier | float(1)) %}
            {% set x = [0, [x, 100] | min] | max %}
            {% set ns.n = ns.n + 1 %}
            {% if x < ns.v %}{% set ns.v = x %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.v | round(1) if ns.n > 0 else 0 }}
      open_windows: >-
        {% set ns = namespace(n=0) %}
        {% for e in window_entities %}
          {% if is_state(e, 'on') or is_state(e, 'open') %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.n }}

  # 30-minútový trend bez ďalšieho helpera.
  - variables:
      effective_prev_trend_ref_temp: >-
        {{ t_room if (prev_trend_ref_temp | float) <= -100 else prev_trend_ref_temp }}
      trend_elapsed_h: >-
        {{ ((now_ts | float - prev_trend_ref_ts | float) / 3600) if (prev_trend_ref_ts | float) > 0 else 0 }}
      update_trend_reference: >-
        {{ (prev_trend_ref_ts | float) <= 0 or (((now_ts | float - prev_trend_ref_ts | float) / 3600) >= 0.5) }}
  - variables:
      temperature_trend_c_per_h: >-
        {% if (prev_trend_ref_ts | float) > 0 and (trend_elapsed_h | float) >= 0.5 and (t_room | float) > -100 %}
          {{ (((t_room | float) - (effective_prev_trend_ref_temp | float)) / (trend_elapsed_h | float)) | round(3) }}
        {% else %}
          {{ prev_trend | float(0) }}
        {% endif %}
      trend_ready: >-
        {{ (prev_trend_ready | bool) or ((prev_trend_ref_ts | float) > 0 and (trend_elapsed_h | float) >= 0.5) }}
  - variables:
      trend_reference_temp_c: >-
        {{ t_room if (update_trend_reference | bool) else effective_prev_trend_ref_temp }}
      trend_reference_timestamp: >-
        {{ now_ts if (update_trend_reference | bool) else prev_trend_ref_ts }}

  # Fyzikálny model radiátora. Aktivuje sa až keď máme oba vodné snímače.
  - variables:
      physical_inputs_ready: >-
        {{ heating_enabled | bool
           and (radiator_nominal_output_w | float(0)) > 0
           and (t_room | float) > -100
           and (t_out | float) > -100
           and (t_supply | float) > -100
           and (t_return | float) > -100
           and (radiator_reference_supply_c | float) > (radiator_reference_room_c | float)
           and (radiator_reference_return_c | float) > (radiator_reference_room_c | float) }}
      delta_t_ref_k: >-
        {{ ((((radiator_reference_supply_c | float) + (radiator_reference_return_c | float)) / 2)
            - (radiator_reference_room_c | float)) | round(3) }}
      delta_t_now_k: >-
        {{ ((((t_supply | float) + (t_return | float)) / 2) - (t_room | float)) | round(3)
           if (t_supply | float) > -100 and (t_return | float) > -100 and (t_room | float) > -100 else 0 }}
  - variables:
      radiator_full_output_w: >-
        {% set dref = delta_t_ref_k | float(0) %}
        {% set dnow = delta_t_now_k | float(0) %}
        {% if physical_inputs_ready | bool and dref > 0 and dnow > 0 %}
          {{ ((radiator_nominal_output_w | float) * ((dnow / dref) ** (radiator_exponent_n | float(1.3)))) | round(0) }}
        {% else %}
          0
        {% endif %}
      inside_outside_delta_k: >-
        {{ ((t_room | float) - (t_out | float)) | round(2)
           if (t_room | float) > -100 and (t_out | float) > -100 else 0 }}
      water_delta_t_k: >-
        {{ ((t_supply | float) - (t_return | float)) | round(2)
           if (t_supply | float) > -100 and (t_return | float) > -100 else 0 }}
      water_stable: >-
        {{ physical_inputs_ready | bool
           and (prev_supply | float) > -100
           and (prev_return | float) > -100
           and (((t_supply | float) - (prev_supply | float)) | abs) <= (max_water_change_c | float)
           and (((t_return | float) - (prev_return | float)) | abs) <= (max_water_change_c | float) }}

  # Kvalitná vzorka pre učenie W/K.
  - variables:
      learning_sample_valid: >-
        {{ physical_inputs_ready | bool
           and (valid_valve_count | int(0)) > 0
           and (valve_min_pct | float(0)) >= (valve_learning_threshold_pct | float)
           and (open_windows | int(0)) == 0
           and (target_stable | bool)
           and (trend_ready | bool)
           and ((temperature_trend_c_per_h | float(0)) | abs) <= (stable_room_trend_c_per_h | float)
           and (inside_outside_delta_k | float(0)) >= (min_inside_outside_delta_c | float)
           and (water_delta_t_k | float(0)) >= 2
           and (t_return | float) > ((t_room | float) + 1)
           and (water_stable | bool)
           and ((not (night_learning_only | bool)) or ((sun_elevation | float) <= 0)) }}
      heat_loss_sample_w_per_k: >-
        {% if learning_sample_valid | bool and (inside_outside_delta_k | float) > 0 %}
          {{ ((radiator_full_output_w | float) / (inside_outside_delta_k | float)) | round(3) }}
        {% else %}
          0
        {% endif %}
      learning_blockers: >-
        {% set ns = namespace(x=[]) %}
        {% if not (heating_enabled | bool) %}{% set ns.x = ns.x + ['termostat_off'] %}{% endif %}
        {% if not (physical_inputs_ready | bool) %}{% set ns.x = ns.x + ['fyzikalne_vstupy'] %}{% endif %}
        {% if (valid_valve_count | int(0)) <= 0 %}{% set ns.x = ns.x + ['trv_bez_hodnoty'] %}{% endif %}
        {% if (valid_valve_count | int(0)) > 0 and (valve_min_pct | float(0)) < (valve_learning_threshold_pct | float) %}{% set ns.x = ns.x + ['trv_nie_su_otvorene'] %}{% endif %}
        {% if (open_windows | int(0)) > 0 %}{% set ns.x = ns.x + ['otvorene_okno'] %}{% endif %}
        {% if not (target_stable | bool) %}{% set ns.x = ns.x + ['po_zmene_setpointu'] %}{% endif %}
        {% if not (trend_ready | bool) %}{% set ns.x = ns.x + ['trend_sa_este_uci'] %}{% endif %}
        {% if (trend_ready | bool) and ((temperature_trend_c_per_h | float(0)) | abs) > (stable_room_trend_c_per_h | float) %}{% set ns.x = ns.x + ['izba_nie_je_ustalena'] %}{% endif %}
        {% if (inside_outside_delta_k | float(0)) < (min_inside_outside_delta_c | float) %}{% set ns.x = ns.x + ['maly_rozdiel_vnutri_vonku'] %}{% endif %}
        {% if (t_supply | float) > -100 and (t_return | float) > -100 and (water_delta_t_k | float(0)) < 2 %}{% set ns.x = ns.x + ['maly_spad_vody'] %}{% endif %}
        {% if (t_supply | float) > -100 and (t_return | float) > -100 and not (water_stable | bool) %}{% set ns.x = ns.x + ['nestabilna_voda'] %}{% endif %}
        {% if (night_learning_only | bool) and (sun_elevation | float) > 0 %}{% set ns.x = ns.x + ['slnecne_zisky'] %}{% endif %}
        {{ ns.x | unique | join(', ') if ns.x | length > 0 else 'OK' }}

  # Adaptívne učenie – EMA.
  - variables:
      heat_loss_coefficient_w_per_k: >-
        {% set old = prev_h | float(0) %}
        {% set sample = heat_loss_sample_w_per_k | float(0) %}
        {% set a = learning_alpha | float(0.05) %}
        {% if learning_sample_valid | bool and sample > 0 %}
          {% if old > 0 %}
            {{ ((1 - a) * old + a * sample) | round(3) }}
          {% else %}
            {{ sample | round(3) }}
          {% endif %}
        {% elif old > 0 %}
          {{ old | round(3) }}
        {% else %}
          {{ initial_heat_loss_coefficient_w_per_k | float(0) }}
        {% endif %}
      learning_samples: >-
        {{ (prev_learning_samples | int(0)) + (1 if (learning_sample_valid | bool) else 0) }}
  - variables:
      learning_confidence_pct: >-
        {% set n = learning_samples | int(0) %}
        {% if (heat_loss_coefficient_w_per_k | float(0)) <= 0 %}
          0
        {% else %}
          {{ [100, n] | min | round(0) }}
        {% endif %}

  # Živý odhad straty a potrebnej teploty vody.
  - variables:
      heat_loss_now_w: >-
        {% set h = heat_loss_coefficient_w_per_k | float(0) %}
        {% set dt = [0, (t_room | float) - (t_out | float)] | max
                    if (t_room | float) > -100 and (t_out | float) > -100 else 0 %}
        {{ (h * dt) | round(0) if h > 0 else 0 }}
      heat_loss_at_target_w: >-
        {% set h = heat_loss_coefficient_w_per_k | float(0) %}
        {% set dt = [0, (t_target | float) - (t_out | float)] | max
                    if (t_target | float) > -100 and (t_out | float) > -100 else 0 %}
        {{ (h * dt) | round(0) if h > 0 else 0 }}
      required_supply_temp_c: >-
        {% set q = heat_loss_at_target_w | float(0) %}
        {% set qn = radiator_nominal_output_w | float(0) %}
        {% set dref = delta_t_ref_k | float(0) %}
        {% set n = radiator_exponent_n | float(1.3) %}
        {% if q > 0 and qn > 0 and dref > 0 and n > 0 and (t_target | float) > -100 %}
          {% set required_mean_delta = dref * ((q / qn) ** (1 / n)) %}
          {% set required_mean_water = (t_target | float) + required_mean_delta %}
          {{ (required_mean_water + ((assumed_water_delta_t_c | float) / 2)) | round(1) }}
        {% else %}
          0
        {% endif %}

  # Potreba tepla. Pri HVAC off je vždy 0 %.
  - variables:
      temperature_error_c: >-
        {{ ((t_target | float) - (t_room | float)) | round(2)
           if (t_target | float) > -100 and (t_room | float) > -100 else 0 }}
      temperature_demand_pct: >-
        {% if not (heating_enabled | bool) %}
          0
        {% else %}
          {% set e = temperature_error_c | float(0) %}
          {{ ([0, [((e + 0.1) * 100), 100] | min] | max) | round(1) }}
        {% endif %}
      valve_demand_pct: >-
        {{ (((0.7 * (valve_avg_pct | float(0))) + (0.3 * (valve_max_pct | float(0)))) | round(1))
           if heating_enabled | bool else 0 }}
  - variables:
      room_heat_demand_pct: >-
        {% if not (heating_enabled | bool) %}
          0
        {% else %}
          {{ ([0, [[(temperature_demand_pct | float(0)), (valve_demand_pct | float(0))] | max, 100] | min] | max) | round(1) }}
        {% endif %}
      weighted_heat_demand_pct: >-
        {{ ((room_heat_demand_pct | float(0)) * (room_weight | float(1))) | round(1) }}

sensor:
  availability: >-
    {{ (t_room | float(-999)) > -100
       and (t_target | float(-999)) > -100
       and has_value(outside_temperature_entity)
       and (valid_valve_count | int(0)) > 0 }}
  state: "{{ room_heat_demand_pct | float(0) | round(1) }}"
  unit_of_measurement: "%"
  state_class: measurement
  icon: mdi:radiator
  attributes:
    room: "{{ room_label }}"
    hvac_mode: "{{ hvac_mode }}"
    hvac_action: "{{ hvac_action }}"
    heating_enabled: "{{ heating_enabled | bool }}"

    room_temperature_source: "{{ room_temperature_source }}"
    actual_temp_c: "{{ t_room | float(0) | round(2) }}"
    target_temp_c: "{{ t_target | float(0) | round(2) }}"
    previous_target_temp_c: "{{ t_target | float(0) | round(2) }}"
    target_change_timestamp: "{{ target_change_timestamp | float(0) }}"
    target_stable_minutes: "{{ target_stable_minutes | float(0) | round(1) }}"
    target_stable: "{{ target_stable | bool }}"
    outside_temp_c: "{{ t_out | float(0) | round(2) if (t_out | float) > -100 else none }}"
    temperature_error_c: "{{ temperature_error_c | float(0) | round(2) }}"
    temperature_trend_c_per_h: "{{ temperature_trend_c_per_h | float(0) | round(3) }}"
    trend_ready: "{{ trend_ready | bool }}"
    trend_reference_temp_c: "{{ trend_reference_temp_c | float(0) | round(3) }}"
    trend_reference_timestamp: "{{ trend_reference_timestamp | float(0) }}"

    valve_count: "{{ valid_valve_count | int(0) }}"
    valve_avg_pct: "{{ valve_avg_pct | float(0) | round(1) }}"
    valve_max_pct: "{{ valve_max_pct | float(0) | round(1) }}"
    valve_min_pct: "{{ valve_min_pct | float(0) | round(1) }}"
    open_windows: "{{ open_windows | int(0) }}"

    supply_temp_c: "{{ t_supply | float(0) | round(2) if (t_supply | float) > -100 else none }}"
    return_temp_c: "{{ t_return | float(0) | round(2) if (t_return | float) > -100 else none }}"
    water_delta_t_k: "{{ water_delta_t_k | float(0) | round(2) }}"
    water_stable: "{{ water_stable | bool }}"

    radiator_nominal_output_w: "{{ radiator_nominal_output_w | float(0) | round(0) }}"
    radiator_full_output_w: "{{ radiator_full_output_w | float(0) | round(0) }}"
    radiator_delta_t_ref_k: "{{ delta_t_ref_k | float(0) | round(2) }}"
    radiator_delta_t_now_k: "{{ delta_t_now_k | float(0) | round(2) }}"

    learning_sample_valid: "{{ learning_sample_valid | bool }}"
    learning_blockers: "{{ learning_blockers }}"
    heat_loss_sample_w_per_k: "{{ heat_loss_sample_w_per_k | float(0) | round(2) }}"
    heat_loss_coefficient_w_per_k: "{{ heat_loss_coefficient_w_per_k | float(0) | round(2) }}"
    learning_samples: "{{ learning_samples | int(0) }}"
    learning_confidence_pct: "{{ learning_confidence_pct | float(0) | round(0) }}"

    heat_loss_now_w: "{{ heat_loss_now_w | float(0) | round(0) }}"
    heat_loss_at_target_w: "{{ heat_loss_at_target_w | float(0) | round(0) }}"
    required_supply_temp_c: "{{ required_supply_temp_c | float(0) | round(1) }}"

    temperature_demand_pct: "{{ temperature_demand_pct | float(0) | round(1) }}"
    valve_demand_pct: "{{ valve_demand_pct | float(0) | round(1) }}"
    weighted_heat_demand_pct: "{{ weighted_heat_demand_pct | float(0) | round(1) }}"
    room_weight: "{{ room_weight | float(1) }}"
